; Tamagotchi-Lernspielgerät – M5Stack Core2
; https://docs.platformio.org/page/projectconf.html

[env:m5stack-core2]
platform = espressif32
board = m5stack-core2
framework = arduino
monitor_speed = 115200
; Der Code nutzt std::make_unique, std::function u.ae. (C++14+); ohne
; diese Flags faellt der Toolchain-Default je nach Plattformversion auf
; C++11 zurueck (z. B. "std::make_unique is only available from C++14
; onwards"). build_unflags entfernt den vom Arduino-ESP32-Framework
; vorgegebenen ansonsten weiterhin wirksamen -std=gnu++11.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    bblanchon/ArduinoJson
